# ============================================================================
# SEDNA GROUP — CONFIGURAÇÃO DE PROXY REVERSO NGINX (HARDENED / DEVSECOPS)
# ============================================================================
# Como aplicar em servidor Linux (Ubuntu/Debian):
#   1. Copie este bloco server/http para /etc/nginx/sites-available/sedna.conf
#   2. Crie o link simbólico: sudo ln -s /etc/nginx/sites-available/sedna.conf /etc/nginx/sites-enabled/
#   3. Teste a sintaxe: sudo nginx -t
#   4. Recarregue o Nginx: sudo systemctl reload nginx
#
# IMPORTANTE — BLINDAGEM DE REDE DO MYSQL 5.7 (my.cnf / my.ini):
#   No arquivo /etc/mysql/mysql.conf.d/mysqld.cnf (Linux) ou my.ini (Windows):
#     [mysqld]
#     bind-address = 127.0.0.1
#     port = 3306
#     local-infile = 0
#     symbolic-links = 0
#   Jamais exponha a porta 3306 na internet/WAN.
# ============================================================================

# Oculta a versão do servidor Nginx nos cabeçalhos HTTP ("Server: nginx") e páginas de erro
server_tokens off;

# Zonas de Rate Limiting no Proxy Reverso (defesa em profundidade além do Express)
limit_req_zone $binary_remote_addr zone=sedna_login_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sedna_api_limit:10m rate=120r/m;

# Upstream apontando exclusivamente para o loopback local onde roda o Node.js
upstream sedna_node_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# 1. Redirecionamento obrigatório de HTTP (80) para HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name pedidos.sednagroup.com.br _;

    server_tokens off;

    # Redireciona todo o tráfego para HTTPS
    return 301 https://$host$request_uri;
}

# 2. Servidor Principal HTTPS com Terminação TLS 1.2 / 1.3 e Cabeçalhos de Segurança
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pedidos.sednagroup.com.br _;

    server_tokens off;

    # ------------------------------------------------------------------------
    # Certificados TLS/HTTPS (Let's Encrypt / Certbot ou Certificado Corporativo)
    # ------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/sedna/fullchain.pem;
    ssl_certificate_key /etc/ssl/sedna/privkey.pem;

    # Protocolos e Cifras Seguras (Apenas TLS 1.2 e TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Limite de tamanho de upload (logos e fotos de embarcações)
    client_max_body_size 15M;

    # ------------------------------------------------------------------------
    # Cabeçalhos HTTP de Segurança (Security Headers)
    # ------------------------------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https: http:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;

    # Remove cabeçalhos que possam revelar a stack do backend
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Bloqueia acesso a arquivos ocultos (.env, .git, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ------------------------------------------------------------------------
    # Rate Limiting estrito na rota de Login (Anti Brute-Force)
    # ------------------------------------------------------------------------
    location = /api/auth/login {
        limit_req zone=sedna_login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://sedna_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cookie_path / "/; HttpOnly; Secure; SameSite=Lax";
    }

    # ------------------------------------------------------------------------
    # Rotas de API (/api/*)
    # ------------------------------------------------------------------------
    location /api/ {
        limit_req zone=sedna_api_limit burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://sedna_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ------------------------------------------------------------------------
    # Aplicação Web Principal e Arquivos Estáticos
    # ------------------------------------------------------------------------
    location / {
        proxy_pass http://sedna_node_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
